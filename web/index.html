<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ankit Kulshrestha</title>
    <meta name="description" content="Personal website of Ankit Kulshrestha" />
    <script>
      // Apply a saved dark-mode choice before the page draws, so it doesn't
      // flash light first. ThemeToggle.tsx saves the choice.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {
        // Storage can be blocked (e.g. some private windows); stay light
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
